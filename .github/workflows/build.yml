name: Display X Studio

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'nuitka-1.4.0'
      - 'nuitka-1.4.0'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      test_version:
        description: 'Test package version (leave empty for normal build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare_release:
    name: Prepare GitHub Release
    runs-on: ubuntu-22.04

    steps:
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.DXS_RELEASE_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo tvnt04/DXS-Releases >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; reusing it."
          else
            gh release create "${{ github.ref_name }}" \
              --repo tvnt04/DXS-Releases \
              --title "${{ github.ref_name }}" \
              --target main \
              --generate-notes
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: prepare_release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact: Display-X-Studio-linux-x86_64

          - os: windows-2022
            platform: windows
            artifact: Display-X-Studio-windows-x86_64

          - os: macos-14
            platform: macos
            artifact: Display-X-Studio-macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Override version for test build
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_version != ''
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("app_version.py")
          version = os.environ["TEST_VERSION"]

          text = path.read_text()
          text = re.sub(
              r'APP_VERSION\s*=\s*"[^"]*"',
              f'APP_VERSION = "{version}"',
              text,
              count=1,
          )
          path.write_text(text)
          PY

          grep -n "APP_VERSION" app_version.py
        env:
          TEST_VERSION: ${{ github.event.inputs.test_version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirement.txt


      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement.txt
          python -m pip install pyinstaller

      - name: Build application
        shell: bash
        env:
          DXSL_RELEASE_BUILD: "1"
        run: |
          python -m pip install nuitka
          python packaging/build_nuitka.py

      # -------------------------
      # Linux
      # -------------------------

      - name: Verify Linux executable
        if: matrix.platform == 'linux'
        run: |
          test -x "dist/Display X Studio/Display X Studio"

      - name: Install appimagetool
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool

      - name: Prepare Linux AppDir
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin

          cp -a \
            "dist/Display X Studio/." \
            "AppDir/usr/bin/"

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/usr/bin/Display X Studio" "$@"
          EOF

          chmod +x AppDir/AppRun

          mkdir -p \
            AppDir/usr/share/icons/hicolor/256x256/apps

          cp logo_icon.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/display-x-studio.png

          cp logo_icon.png AppDir/display-x-studio.png

          cat > AppDir/Display\ X\ Studio.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Display X Studio
          Comment=Display X Studio
          Exec=Display X Studio
          Icon=display-x-studio
          Categories=Graphics;
          Terminal=false
          EOF

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          ./appimagetool \
            AppDir \
            "${{ matrix.artifact }}.AppImage"

      - name: Build Debian package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python packaging/build_deb.py

      # -------------------------
      # Windows
      # -------------------------

      - name: Verify Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/Display X Studio/Display X Studio.exe')) {
            throw 'PyInstaller did not produce the Windows executable.'
          }

      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          Write-Host "Building Windows installer version $version"

          $iss = "packaging\windows\Display X Studio.iss"
          $content = Get-Content $iss -Raw

          $content = $content -replace `
            '#define MyAppVersion "[^"]*"', `
            "#define MyAppVersion `"$version`""

          Set-Content $iss $content -Encoding UTF8

          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            $iss

          $installer = Get-ChildItem -Path . -Filter "Display-X-Studio-*-Setup.exe" |
            Select-Object -First 1

          if ($null -eq $installer) {
            throw "Inno Setup did not produce the installer."
          }

          Write-Host "Created installer: $($installer.Name)"

      - name: Package Windows portable ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          7z a "${{ matrix.artifact }}.zip" "dist/Display X Studio/*"

      # -------------------------
      # macOS
      # -------------------------

      - name: Verify macOS application
        if: matrix.platform == 'macos'
        run: |
          test -d "dist/Display X Studio.app"

      - name: Prepare macOS DMG contents
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          rm -rf "DMG Contents"
          mkdir -p "DMG Contents"
          cp -R "dist/Display X Studio.app" "DMG Contents/"

      - name: Create macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          hdiutil create \
            -volname "Display X Studio" \
            -srcfolder "dist/Display X Studio.app" \
            -ov \
            -format UDZO \
            "${{ matrix.artifact }}.dmg"

      # -------------------------
      # Checksums
      # -------------------------

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sha256sum \
              "${{ matrix.artifact }}.zip" \
              *-Setup.exe \
              > "${{ matrix.artifact }}.sha256"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "${{ matrix.artifact }}.dmg" > "${{ matrix.artifact }}.sha256"
          else
            sha256sum \
              "${{ matrix.artifact }}.AppImage" \
              ./*.deb \
              > "${{ matrix.artifact }}.sha256"
          fi

      # -------------------------
      # Publish release assets
      # -------------------------

      - name: Upload Linux release assets
        if: matrix.platform == 'linux' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DXS_RELEASE_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            --repo tvnt04/DXS-Releases \
            --clobber \
            "${{ matrix.artifact }}.AppImage" \
            ./*.deb \
            "${{ matrix.artifact }}.sha256"

      - name: Upload Windows release assets
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DXS_RELEASE_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            --repo tvnt04/DXS-Releases \
            --clobber \
            "${{ matrix.artifact }}.zip" \
            *-Setup.exe \
            "${{ matrix.artifact }}.sha256"

      - name: Upload macOS release assets
        if: matrix.platform == 'macos' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DXS_RELEASE_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            --repo tvnt04/DXS-Releases \
            --clobber \
            "${{ matrix.artifact }}.dmg" \
            "${{ matrix.artifact }}.sha256"

  # =====================================
  # Finalize GitHub Release
  # =====================================

  finalize_release:
    name: Finalize GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ secrets.DXS_RELEASE_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${{ github.ref_name }}" \
            --repo tvnt04/DXS-Releases \
            --dir release-assets

      - name: Generate combined checksums
        working-directory: release-assets
        shell: bash
        run: |
          cat *.sha256 > SHA256SUMS.txt

      - name: Upload combined checksums
        env:
          GH_TOKEN: ${{ secrets.DXS_RELEASE_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            --repo tvnt04/DXS-Releases \
            --clobber \
            release-assets/SHA256SUMS.txt
