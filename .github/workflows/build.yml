name: Build Display X Studio

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: Display-X-Studio-linux-x86_64

          - os: windows-2022
            artifact: Display-X-Studio-windows-x86_64

          - os: macos-14
            artifact: Display-X-Studio-macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement.txt
          python -m pip install pyinstaller

      - name: Build application
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "Display X Studio" \
            --add-data "logo.png:." \
            main.py

      - name: Verify Linux executable
        if: runner.os == 'Linux'
        run: |
          test -x "dist/Display X Studio/Display X Studio"

      - name: Verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/Display X Studio/Display X Studio.exe')) {
            throw 'PyInstaller did not produce the Windows executable.'
          }

      - name: Verify macOS application
        if: runner.os == 'macOS'
        run: |
          test -d "dist/Display X Studio.app"

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          tar -C dist \
            -czf "artifacts/${{ matrix.artifact }}.tar.gz" \
            "Display X Studio"

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          7z a "artifacts/${{ matrix.artifact }}.zip" "dist/Display X Studio/*"

      - name: Package macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          tar -C dist \
            -czf "artifacts/${{ matrix.artifact }}.tar.gz" \
            "Display X Studio.app"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
