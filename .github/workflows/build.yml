name: Display X Studio

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact: Display-X-Studio-linux-x86_64

          - os: windows-2022
            platform: windows
            artifact: Display-X-Studio-windows-x86_64

          - os: macos-14
            platform: macos
            artifact: Display-X-Studio-macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirement.txt


      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement.txt
          python -m pip install pyinstaller

      - name: Prepare Windows icon
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python -c "from PIL import Image; src=Image.open('logo.png').convert('RGBA'); sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)]; images=[src.resize(size, Image.Resampling.LANCZOS) for size in sizes]; images[0].save('logo.ico', format='ICO', sizes=sizes)"

      - name: Build application
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            "packaging/Display X Studio.spec"

      # -------------------------
      # Linux
      # -------------------------

      - name: Verify Linux executable
        if: matrix.platform == 'linux'
        run: |
          test -x "dist/Display X Studio/Display X Studio"

      - name: Install appimagetool
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool

      - name: Prepare Linux AppDir
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin

          cp -a \
            "dist/Display X Studio/." \
            "AppDir/usr/bin/"

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/usr/bin/Display X Studio" "$@"
          EOF

          chmod +x AppDir/AppRun

          mkdir -p \
            AppDir/usr/share/icons/hicolor/256x256/apps

          cp logo_icon.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/display-x-studio.png

          cp logo_icon.png AppDir/display-x-studio.png

          cat > AppDir/Display\ X\ Studio.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Display X Studio
          Comment=Display X Studio
          Exec=Display X Studio
          Icon=display-x-studio
          Categories=Graphics;
          Terminal=false
          EOF

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          ./appimagetool \
            AppDir \
            "${{ matrix.artifact }}.AppImage"

      - name: Install RPM build tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build Debian package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python packaging/build_deb.py

      - name: Build RPM package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python packaging/build_rpm.py

      # -------------------------
      # Windows
      # -------------------------

      - name: Verify Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/Display X Studio/Display X Studio.exe')) {
            throw 'PyInstaller did not produce the Windows executable.'
          }

      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "packaging\windows\Display X Studio.iss"

          $installer = Get-ChildItem -Path . -Filter "Display-X-Studio-*-Setup.exe" | Select-Object -First 1

          if ($null -eq $installer) {
            throw "Inno Setup did not produce the installer."
          }

      - name: Package Windows portable ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          7z a "${{ matrix.artifact }}.zip" "dist/Display X Studio/*"

      # -------------------------
      # macOS
      # -------------------------

      - name: Verify macOS application
        if: matrix.platform == 'macos'
        run: |
          test -d "dist/Display X Studio.app"

      - name: Create macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          hdiutil create \
            -volname "Display X Studio" \
            -srcfolder "dist/Display X Studio.app" \
            -ov \
            -format UDZO \
            "${{ matrix.artifact }}.dmg"

      # -------------------------
      # Checksums
      # -------------------------

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sha256sum \
              "${{ matrix.artifact }}.zip" \
              *-Setup.exe \
              > "${{ matrix.artifact }}.sha256"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "${{ matrix.artifact }}.dmg" > "${{ matrix.artifact }}.sha256"
          else
            sha256sum \
              "${{ matrix.artifact }}.AppImage" \
              ./*.deb \
              ./*.rpm \
              > "${{ matrix.artifact }}.sha256"
          fi

      # -------------------------
      # Upload CI artifacts
      # -------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.AppImage
            *.deb
            *.rpm
            *.zip
            *-Setup.exe
            *.dmg
            *.sha256
          if-no-files-found: error
          retention-days: 14

  # =====================================
  # Create GitHub Release for version tags
  # =====================================

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Display-X-Studio-linux-x86_64
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Display-X-Studio-windows-x86_64
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Display-X-Studio-macos-arm64
          path: release-assets

      - name: Generate combined checksums
        working-directory: release-assets
        run: |
          cat *.sha256 > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.zip
            release-assets/*-Setup.exe
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
